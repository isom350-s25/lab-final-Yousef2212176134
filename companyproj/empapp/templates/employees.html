<!DOCTYPE html>
<html>
<head>
    <title>Employee List</title>
</head>
<body>
    <h1>Employee List</h1>
    <a href="{% url 'create_employee' %}">Create New Employee</a>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th> <!-- Replace 'name' with the appropriate field from your Employee model -->
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for employee in employees %}
            <tr>
                <td>{{ employee.id }}</td>
                <td>{{ employee.name }}</td> <!-- Replace 'name' with the appropriate field -->
                <td>
                    <a href="{% url 'update_employee' employee.id %}">Edit</a>
                    <a href="{% url 'delete_employee' employee.id %}">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
