<!DOCTYPE html>
<html>
<head>
    <title>Delete Employee</title>
</head>
<body>
    <h1>Are you sure you want to delete this employee?</h1>
    <p>{{ employee.name }}</p> <!-- Replace 'name' with the appropriate field from your Employee model -->
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>
    <a href="{% url 'employees' %}">Cancel</a>
</body>
</html>
